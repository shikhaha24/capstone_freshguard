environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.5.4
  google_generative_ai: ^0.4.7
  flutter_barcode_scanner: ^2.0.0
  google_mlkit_text_recognition: ^0.17.1
